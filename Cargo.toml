[package]
name = "no-watermark"
version = "1.0.0"
edition = "2021"
description = "Hide the Windows desktop watermark by patching explorer's in-memory shell32 (no resident process)"
license = "MIT"
repository = "https://github.com/MiChongs/no-watermark"

[[bin]]
name = "NoWatermark"
path = "src/main.rs"

[dependencies]
pdb = "0.8"
ureq = "2"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
